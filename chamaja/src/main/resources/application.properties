spring.application.name=chamaja
server.port=${PORT:8080}
# Atrás do proxy da Railway: usa os cabeçalhos X-Forwarded-* (IP real, https)
server.forward-headers-strategy=framework
server.error.include-message=never

# Banco (PostgreSQL). Na Railway, monte DB_URL a partir das variáveis do serviço:
#   jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chamaja}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Migrações só no perfil "prod" (application-prod.properties); localmente o Hibernate cria as tabelas.
spring.flyway.enabled=false

# URL pública usada no QR code. Em branco = usa o endereço da requisição.
chamaja.base-url=${APP_BASE_URL:}

# QR code rotativo da tela de entrada. QR_SEGREDO assina os códigos (em branco = segredo temporário
# gerado a cada início). Cada código vale a janela atual e a anterior; a permissão que o aparelho
# ganha ao escanear dura alguns minutos e só serve uma vez.
chamaja.qr.segredo=${QR_SEGREDO:}
chamaja.qr.janela-segundos=60
chamaja.qr.permissao-minutos=10
# Web Push (avisos no celular com a tela bloqueada). Gere o par de chaves VAPID uma vez (veja o README)
# e defina VAPID_PUBLIC e VAPID_PRIVATE; sem elas o recurso fica desligado. O assunto identifica o
# servidor ao serviço de push: use o endereço do site, nunca um e-mail pessoal.
chamaja.push.publica=${VAPID_PUBLIC:}
chamaja.push.privada=${VAPID_PRIVATE:}
chamaja.push.assunto=${VAPID_ASSUNTO:${APP_BASE_URL:https://localhost}}
# Limite de requisições que alteram dados (ou escaneiam o QR) por IP e por minuto.
chamaja.rate-limit.por-minuto=30

# Dados iniciais (criados só se o banco estiver vazio).
# Se SEED_SENHA ficar em branco, uma senha aleatória é gerada e escrita no log.
chamaja.seed.enabled=true
chamaja.seed.nome=${SEED_NOME:Mercado Demo}
chamaja.seed.usuario=${SEED_USUARIO:operador}
chamaja.seed.senha=${SEED_SENHA:}

# Rotina diária: apaga as senhas (e os nomes dos clientes) e reinicia a numeração (RNF06)
chamaja.reset-cron=0 0 4 * * *
