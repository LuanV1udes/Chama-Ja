spring.application.name=chamaja
server.port=${PORT:8080}
# Atrás do proxy da Railway: usa os cabeçalhos X-Forwarded-* (IP real, https)
server.forward-headers-strategy=framework
server.error.include-message=never

# Banco (PostgreSQL). Na Railway, monte DB_URL a partir das variáveis do serviço:
#   jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chamaja}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Migrações só no perfil "prod" (application-prod.properties); localmente o Hibernate cria as tabelas.
spring.flyway.enabled=false

# URL pública usada no QR code. Em branco = usa o endereço da requisição.
chamaja.base-url=${APP_BASE_URL:}

# Dados iniciais (criados só se o banco estiver vazio).
# Se SEED_SENHA ficar em branco, uma senha aleatória é gerada e escrita no log.
chamaja.seed.enabled=true
chamaja.seed.nome=${SEED_NOME:Mercado Demo}
chamaja.seed.usuario=${SEED_USUARIO:operador}
chamaja.seed.senha=${SEED_SENHA:}

# Rotina diária: apaga as senhas (e os nomes dos clientes) e reinicia a numeração (RNF06)
chamaja.reset-cron=0 0 4 * * *
