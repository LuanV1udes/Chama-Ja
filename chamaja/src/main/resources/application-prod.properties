# Perfil de produção (Railway + Supabase). Ativado por SPRING_PROFILES_ACTIVE=prod
# (o Dockerfile já define isso).
#
# Variáveis obrigatórias: DB_URL, DB_USER, DB_PASSWORD (ver README).
# Recomendadas: SEED_SENHA, APP_BASE_URL.

# O schema é criado e atualizado SÓ pelas migrações (src/main/resources/db/migration).
# O Hibernate apenas confere se o mapeamento bate com o banco.
spring.flyway.enabled=true
spring.flyway.schemas=chamaja
spring.flyway.default-schema=chamaja
spring.flyway.create-schemas=true
spring.jpa.hibernate.ddl-auto=validate

# As tabelas ficam no schema "chamaja", fora do "public". O Supabase expõe o "public" numa API REST
# aberta por chave anônima; um schema próprio mantém os dados dos clientes fora dela.
spring.jpa.properties.hibernate.default_schema=chamaja

# O pooler do Supabase limita as conexões: poucas e reaproveitadas.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

spring.thymeleaf.cache=true
server.shutdown=graceful
