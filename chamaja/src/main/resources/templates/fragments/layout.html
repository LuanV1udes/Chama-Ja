<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#d9480f">
    <title th:text="${titulo} + ' · Chama Já'">Chama Já</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/png" th:href="@{/img/icone-192.png}">
    <link rel="apple-touch-icon" th:href="@{/img/icone-192.png}">
    <!-- Só na tela da senha: abre o ícone instalado direto na senha do cliente (iPhone). -->
    <link rel="manifest" th:if="${manifesto != null}" th:href="${manifesto}">
</head>
<body>

<!-- Abas do painel, em pílulas -->
<nav class="pills" aria-label="Painel" th:fragment="pills(ativo)">
    <a th:href="@{/painel}" th:classappend="${ativo == 'fila'} ? 'ativo'" th:attr="aria-current=${ativo == 'fila' ? 'page' : null}">Fila</a>
    <a th:href="@{/painel/promocoes}" th:classappend="${ativo == 'promocoes'} ? 'ativo'" th:attr="aria-current=${ativo == 'promocoes' ? 'page' : null}">Promoções</a>
    <a th:href="@{/painel/tela}" th:classappend="${ativo == 'tela'} ? 'ativo'" th:attr="aria-current=${ativo == 'tela' ? 'page' : null}">Tela de entrada</a>
</nav>

<!-- Barra do topo das telas de promoções e QR code -->
<header class="topo" th:fragment="barra(nome, ativo)">
    <img class="logo-topo" th:src="@{/img/logo.png}" width="480" height="283" alt="">
    <div class="topo-marca">
        <strong>Chama Já</strong>
        <span th:text="${nome}">Estabelecimento</span>
    </div>
    <nav class="pills" aria-label="Painel">
        <a th:href="@{/painel}" th:classappend="${ativo == 'fila'} ? 'ativo'">Fila</a>
        <a th:href="@{/painel/promocoes}" th:classappend="${ativo == 'promocoes'} ? 'ativo'">Promoções</a>
        <a th:href="@{/painel/tela}" th:classappend="${ativo == 'tela'} ? 'ativo'">Tela de entrada</a>
    </nav>
    <form th:action="@{/logout}" method="post" class="topo-sair">
        <button type="submit" class="btn btn-sutil">Sair</button>
    </form>
</header>

</body>
</html>
