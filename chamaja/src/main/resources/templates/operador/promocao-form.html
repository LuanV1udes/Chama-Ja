<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Promoção')}"></head>
<body class="painel">
<header th:replace="~{fragments/layout :: barra(${est.nome}, 'promocoes')}"></header>

<main class="container">
    <h1 th:text="${form.id == null} ? 'Nova promoção' : 'Editar promoção'">Nova promoção</h1>

    <form th:action="@{/painel/promocoes}" th:object="${form}" method="post" class="cartao form">
        <input type="hidden" th:field="*{id}">

        <label for="titulo">Título</label>
        <input id="titulo" type="text" th:field="*{titulo}" maxlength="100" required>
        <p class="erro-campo" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}">erro</p>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" th:field="*{descricao}" rows="3" maxlength="500"></textarea>
        <p class="erro-campo" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">erro</p>

        <label for="preco">Preço (R$)</label>
        <input id="preco" type="number" step="0.01" min="0" th:field="*{preco}" required>
        <p class="erro-campo" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}">erro</p>

        <label for="validade">Válida até</label>
        <input id="validade" type="date" th:field="*{validade}" required>
        <p class="erro-campo" th:if="${#fields.hasErrors('validade')}" th:errors="*{validade}">erro</p>

        <div class="acoes">
            <button type="submit" class="btn btn-primario">Salvar</button>
            <a class="btn" th:href="@{/painel/promocoes}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
