# Perfil de desenvolvimento: banco H2 em memória, sem precisar do PostgreSQL.
# Rodar com:  mvn spring-boot:run "-Dspring-boot.run.profiles=dev"
spring.datasource.url=jdbc:h2:mem:chamaja;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.thymeleaf.cache=false

# Login de desenvolvimento
chamaja.seed.usuario=operador
chamaja.seed.senha=operador123
